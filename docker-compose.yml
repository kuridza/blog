# Networks allows services to communicate securely by name (e.g., 'db' hostname)
networks:
    laravel_app_network:
        driver: bridge

services:

    # 1. PHP-FPM Service (The main application runner)
    app:
        build:
            context: .
            dockerfile: ./Dockerfile
            # Pass your local user/group ID to ensure file permissions are correct
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: laravel_app
        # Mount the local Laravel directory into the container
        volumes:
            - .:/var/www/html
        networks:
            - laravel_app_network
      # Override the PHP-FPM settings using local configuration if needed
        # env_file:
        #   - .env

    # 2. Nginx Web Server Service
    web:
        image: nginx:stable-alpine
        container_name: laravel_web
        ports:
            # Host port 80 -> Container port 80
            - "8000:80"
        # Mount local code and the Nginx configuration file
        volumes:
            - .:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_app_network
